volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  blockchain_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  gydplatform-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16