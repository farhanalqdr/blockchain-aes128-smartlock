version: '3.8'

services:
  backend:
    build: .
    container_name: gydplatform-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-mongodb://mongodb:27017/gydplatform}
      - DATABASE_NAME=${DATABASE_NAME:-gydplatform}
      - RPC_URL=${RPC_URL}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?Set ADMIN_EMAIL in your environment}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your environment}
      - AES_SHARED_KEY=${AES_SHARED_KEY:-}
      - AES_SHARED_KEY_HEX=${AES_SHARED_KEY_HEX:-}
      - AES_KEY_ID=${AES_KEY_ID:-aes128-shared-v1}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-./logs/app.log}
      - ENCRYPTION_KEY_SIZE=${ENCRYPTION_KEY_SIZE:-2048}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
      - ./keys:/app/keys
    restart: unless-stopped
    networks:
      - gydplatform-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:6.0
    container_name: gydplatform-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=${DATABASE_NAME:-gydplatform}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in your environment}
    restart: unless-stopped
    networks:
      - gydplatform-network
    command: mongod --auth

  redis:
    image: redis:7-alpine
    container_name: gydplatform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - gydplatform-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment}

  nginx:
    image: nginx:alpine
    container_name: gydplatform-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gydplatform-network

  # Optional: Blockchain node for development
  # blockchain-node:
  #   image: ghcr.io/hyperledger/besu:latest
  #   container_name: gydplatform-blockchain
  #   ports:
  #     - "8545:8545"
